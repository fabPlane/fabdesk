name: fabdesk-telemetry

services:
  lgtm:
    # Development/debug stack: OpenTelemetry Collector + Tempo + Grafana.
    image: grafana/otel-lgtm:0.30.1@sha256:bb182ac3174a20923fa58f00d1790fa71eb06cc0150078c0b0e8feb9e6611492
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4318:4318"
    volumes:
      - fabdesk-otel-data:/data
    healthcheck:
      test: ["CMD", "cat", "/tmp/ready"]
      interval: 10s
      timeout: 2s
      retries: 20

volumes:
  fabdesk-otel-data:
