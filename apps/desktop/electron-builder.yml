# electron-builder configuration (plan section 9). Run `bun run package` after `bun run build:core`.
appId: com.tensorfleet.fabdesk
productName: Fabdesk
copyright: Copyright © 2026 TensorFleet
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
afterPack: scripts/after-pack.cjs
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - "!**/*.map"
asar: true
npmRebuild: false
publish: null

# The compiled Bun core is single-arch: apps/core/dist/<os>-<arch>/fabdesk-core[.exe] -> Resources/core/
mac:
  category: public.app-category.developer-tools
  # No arch list here: each CI runner passes --arm64 or --x64 and must build only that arch.
  # Building both on both runners produced identically named installers whose merged artifact
  # download overwrote each other (torn DMGs in v0.1.12 / v0.1.34).
  target: [dmg, zip]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Sign the sidecar with the app so hardened runtime + notarization accept it.
  binaries:
    - Contents/Resources/core/fabdesk-core
  # Notarization is enabled by the release workflow via APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID;
  # unsigned local builds skip it (CSC_IDENTITY_AUTO_DISCOVERY=false).
  notarize: false
  extraResources:
    - from: ../core/dist/darwin-${arch}/
      to: core
      filter: ["fabdesk-core*"]
dmg:
  sign: false
linux:
  executableName: fabdesk
  category: Development
  target: [AppImage, deb]
  maintainer: TensorFleet
  extraResources:
    - from: ../core/dist/linux-${arch}/
      to: core
      filter: ["fabdesk-core*"]
win:
  target: [nsis, portable]
  extraResources:
    - from: ../core/dist/windows-${arch}/
      to: core
      filter: ["fabdesk-core*"]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
