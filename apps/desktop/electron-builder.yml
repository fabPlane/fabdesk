# electron-builder configuration (plan section 9). Run `bun run package` after `bun run build:core`.
# Keep appId as com.tensorfleet.fabdesk: Windows shortcuts, the taskbar AppUserModelId, and NSIS
# uninstall/upgrade identity already shipped under it. Changing the id would orphan pinned
# shortcuts and treat the next install as a new app. In-app updates fetch latest.json by URL and
# do not key off appId. Visible names are productName / executableName (Fabplane / fabplane).
appId: com.tensorfleet.fabdesk
productName: Fabplane
copyright: Copyright © 2026 TensorFleet
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
afterPack: scripts/after-pack.cjs
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - "!**/*.map"
asar: true
npmRebuild: false
publish: null

# The compiled Bun core is single-arch: apps/core/dist/<os>-<arch>/fabdesk-core[.exe] -> Resources/core/
mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  # No arch list here: each CI runner passes --arm64 or --x64 and must build only that arch.
  # Building both on both runners produced identically named installers whose merged artifact
  # download overwrote each other (torn DMGs in v0.1.12 / v0.1.34).
  target: [dmg, zip]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Sign the sidecar with the app so hardened runtime + notarization accept it.
  binaries:
    - Contents/Resources/core/fabdesk-core
  # Notarize with the Apple ID / app-specific password / team id the release workflow exports
  # (APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID). electron-builder skips notarization
  # when they are absent (unsigned local builds), and the installer gate then requires a stapled ticket
  # whenever APPLE_ID is set.
  notarize: true
  extraResources:
    - from: ../core/dist/darwin-${arch}/
      to: core
      filter: ["fabdesk-core*"]
dmg:
  sign: false
linux:
  icon: build/icons
  # desktop Name=Fabplane (productName) and Exec=fabplane
  executableName: fabplane
  category: Development
  target: [AppImage, deb]
  maintainer: TensorFleet
  extraResources:
    - from: ../core/dist/linux-${arch}/
      to: core
      filter: ["fabdesk-core*"]
win:
  icon: build/icon.ico
  executableName: fabplane
  # NSIS only: a portable target shares the artifact name and overwrote the installer in releases
  # (a portable exe ignores /S and runs from %TEMP%).
  target: [nsis]
  extraResources:
    - from: ../core/dist/windows-${arch}/
      to: core
      filter: ["fabdesk-core*"]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
