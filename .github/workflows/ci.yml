name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select-linux-runner:
    uses: ./.github/workflows/select-linux-runner.yml
    secrets: inherit

  # Cheap, no-submodule job so a CMake parse error in the macOS-only shims
  # fails PR CI before anyone dispatches the weekly macos-15 build
  # (run 38013328567: fabdesk_collect_targets _child without parentheses).
  tracemaker-scripts:
    name: TraceMaker scripts + CMake shims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: false

      - name: Install cmake
        run: |
          if ! command -v cmake >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq cmake
          fi
          cmake --version

      - name: Run TraceMaker script tests
        env:
          TM_REQUIRE_CMAKE: "1"
        run: bash scripts/tracemaker/test-scripts.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Scan Git history with redacted output
        run: bash scripts/ci/scan-git-secrets.sh

  verify:
    name: Core verification
    needs: select-linux-runner
    runs-on: ${{ fromJSON(needs.select-linux-runner.outputs.runner) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      # Reuse the existing owned-first allocation for the short routing/control
      # tests. Fork PRs keep the shared selector's GitHub-hosted isolation.
      # Run these before public submodules so control regressions fail early.
      - name: Exercise Linux runner selector
        run: python3 scripts/test-runner-selection.py
      - uses: actions/setup-node@v5
        with:
          package-manager-cache: false
          node-version: 22
      - name: Test shared Mac runner selection
        run: node scripts/ci/macos/tests/selection.test.cjs
      - name: Test shared Mac runner job hooks
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/ci/macos/tests -p 'test_*.py'

      # All source dependencies are public; contributor CI needs no deploy key.
      - name: Initialize public CLI and CAD submodules
        run: git submodule update --init --depth 1 vendor/fabplane-cli vendor/fab_cad

      - name: Resolve the fab_pcb pin
        id: fab-pcb
        run: echo "commit=$(git ls-tree HEAD vendor/fab_pcb | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Check out the pinned fab_pcb workspace
        uses: actions/checkout@v5
        with:
          repository: fabPlane/fab_pcb
          ref: ${{ steps.fab-pcb.outputs.commit }}
          path: vendor/fab_pcb
          token: ${{ github.token }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        id: setup-bun
        continue-on-error: true
        with:
          bun-version: 1.4.0
          no-cache: ${{ startsWith(runner.name, 'tf-nas-') }}

      # GitHub's release download edge can return 504 while the asset API works.
      # Keep the same official archive and verify it before adding it to PATH.
      - name: Recover Bun installation through the release API
        if: steps.setup-bun.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_ARCH" != X64 ]; then
            echo 'This pinned Bun fallback supports Linux X64 only' >&2
            exit 1
          fi
          install_dir=$(mktemp -d "$RUNNER_TEMP/bun-1.4.0.XXXXXX")
          curl --fail --show-error --location --retry 3 --connect-timeout 15 --max-time 120 \
            -H 'Accept: application/octet-stream' \
            https://api.github.com/repos/oven-sh/bun/releases/assets/521567984 \
            -o "$install_dir/bun.zip"
          echo "2d03fb5fb83ac8b567aca0a281b2ce1a1a19d488f56c2968d88c3f25e92fe452  $install_dir/bun.zip" | sha256sum -c -
          unzip -q "$install_dir/bun.zip" -d "$install_dir"
          test -x "$install_dir/bun-linux-x64/bun"
          ln -s bun "$install_dir/bun-linux-x64/bunx"
          echo "$install_dir/bun-linux-x64" >> "$GITHUB_PATH"

      - name: Validate workflow tool setup without preinstalled Node or gh
        run: bun run scripts/test-ci-tools.ts

      - name: Verify unprivileged Debian packaging tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash scripts/setup-linux-packaging.sh
          # GITHUB_PATH is applied in the next step; use its final entry here.
          tools_path=$(tail -n 1 "$GITHUB_PATH")
          if [ -x "$tools_path/ar" ]; then export PATH="$tools_path:$PATH"; fi
          fixture=$(mktemp -d "$RUNNER_TEMP/ar-smoke.XXXXXX")
          printf 'packaging smoke\n' > "$fixture/member"
          ar rcs "$fixture/test.a" "$fixture/member"
          test "$(ar p "$fixture/test.a" member)" = 'packaging smoke'

      - run: bun install --frozen-lockfile

      # No sudo. If cmake/cc/ar are missing, check-cmake.sh prints a notice and
      # exits 0 unless TM_REQUIRE_CMAKE=1 (the hosted job above). When the tools
      # are present the harness still fails the step on a real error.
      - name: TraceMaker script tests
        run: bash scripts/tracemaker/test-scripts.sh

      - run: bun run typecheck
      - run: bun run test

      - name: Build core (public channel)
        run: bun run --cwd apps/core build --only bun-linux-x64 --channel public

      - name: Smoke core daemon
        run: |
          FABDESK_HOME=/tmp/fabdesk-home ./apps/core/dist/linux-x64/fabdesk-core serve --port 0 --handshake-file /tmp/daemon.json &
          for n in $(seq 1 30); do test -f /tmp/daemon.json && break || sleep 1; done
          test -f /tmp/daemon.json
          port=$(jq -r .port /tmp/daemon.json); token=$(jq -r .token /tmp/daemon.json)
          curl -fsS -H "Authorization: Bearer $token" "http://127.0.0.1:$port/health"
          kill %1
