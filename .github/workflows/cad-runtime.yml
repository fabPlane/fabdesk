name: Prepare signed optional CAD runtime
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build the pinned API-capable engine
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          brew install cmake ninja llvm@22 qtbase qttools opencascade boost xerces-c eigen yaml-cpp python@3.12 icu4c@78 tbb
          python3 scripts/build-freecad-macos.py --source "$RUNNER_TEMP/cad-source" --build "$RUNNER_TEMP/cad-build" --install "$RUNNER_TEMP/cad-install"
          python3 scripts/prepare-freecad-macos.py --install "$RUNNER_TEMP/cad-install" --source "$RUNNER_TEMP/cad-source" --python-home /opt/homebrew/opt/python@3.12/Frameworks/Python.framework/Versions/3.12 --output "$RUNNER_TEMP/cad-runtime" --source-cache "$RUNNER_TEMP/cad-sources"
          FABDESK_FREECAD_RUNTIME="$RUNNER_TEMP/cad-runtime" bun run cad:stage --target bun-darwin-arm64
          bun run cad:smoke dist/cad/darwin-arm64/bundle.json
      - name: Sign, notarize, staple and measure optional runtime
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bun scripts/package-cad-runtime.ts dist/cad/darwin-arm64 dist/cad-runtime
      - name: Preserve reviewable runtime assets (does not publish a public release)
        uses: actions/upload-artifact@v4
        with:
          name: signed-cad-runtime-darwin-arm64
          path: |
            dist/cad-runtime/cad-runtime-darwin-arm64.zip
            dist/cad-runtime/manifest-darwin-arm64.json
            dist/cad-runtime/cad-runtime-sources.tar.gz
            dist/cad-runtime/NOTICE.txt
          if-no-files-found: error
