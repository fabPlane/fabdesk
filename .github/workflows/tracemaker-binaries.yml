# One-off restore on branch ops/restore-tracemaker-latest (2026-11-18). Not for merging.
# Points the public tracemaker-latest manifest back at the immutable v0.12.1-db5950f build.
name: TraceMaker binaries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-latest:
    name: Restore tracemaker-latest to v0.12.1-db5950f
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false
      - name: Restore
        env:
          TRACEMAKER_PUBLIC_BASE_URL: ${{ vars.TRACEMAKER_PUBLIC_BASE_URL }}
          TRACEMAKER_S3_BUCKET: ${{ vars.TRACEMAKER_S3_BUCKET }}
          TRACEMAKER_S3_ENDPOINT: ${{ vars.TRACEMAKER_S3_ENDPOINT }}
          TRACEMAKER_S3_REGION: ${{ vars.TRACEMAKER_S3_REGION }}
          TRACEMAKER_S3_PREFIX: ${{ vars.TRACEMAKER_S3_PREFIX }}
          TRACEMAKER_S3_ACCESS_KEY_ID: ${{ secrets.TRACEMAKER_S3_ACCESS_KEY_ID }}
          TRACEMAKER_S3_SECRET_ACCESS_KEY: ${{ secrets.TRACEMAKER_S3_SECRET_ACCESS_KEY }}
          DESKTOP_R2_ACCESS_KEY_ID: ${{ vars.DESKTOP_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/tracemaker/restore-latest.sh
