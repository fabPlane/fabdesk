# Weekly TraceMaker binaries for Settings → Routers.
#
# Upstream (DingoOz/TraceMaker) is C++20 / GPL-3.0-or-later and publishes no
# official router binaries. This workflow follows their README + CI:
#   Linux:  cmake --preset cpu-only   (Ubuntu 26.04, GCC 15, no CUDA)
#   macOS:  cmake --preset macos-metal, CMAKE_OSX_DEPLOYMENT_TARGET=15.0.
#           Two libc++ variants in one job (prefer A): Apple clang + system
#           libc++.1.dylib, then Homebrew LLVM static libc++ (run 38016562996
#           linked B then SIGABRT on --help). Smoke each; publish the first
#           that passes. A commit-pinned from_chars(double) + <cstdlib> patch
#           is applied when HEAD matches v0.9.0. SQLite headers are isolated
#           so FindSQLite3 does not -isystem the Xcode SDK (run 38005104781).
#           zstd is libzstd.a (run 38009143938). ninja -k 0; smoke abort
#           uploads unpackaged binaries + lldb/dyld/crash logs.
#   Windows: no upstream CMake preset (base prepends /usr/bin; Warnings.cmake
#           is GCC-only). Best-effort MSYS2 UCRT64 + Ninja, static libgcc/
#           libstdc++ / zstd / sqlite, plus ws2_32/mswsock/bcrypt. A
#           commit-pinned MinGW patch is applied only on this platform when
#           HEAD matches v0.9.0 (M_PI, filesystem::path::string()).
#           Git for Windows checkouts force core.autocrlf=false / core.eol=lf
#           (run 38082482176: LF patch vs CRLF sources).
#           continue-on-error so a Windows failure
#           leaves linux/macos published and the workflow green. After
#           TRACEMAKER_OPTIONAL_FAIL_LIMIT consecutive failures the platform
#           is waived (platform-status.json) so the weekly run can skip.
# Each archive ships tracemaker and its placer tracemaker-place (board_route's
# floorplan path; built, linkage-probed, smoked, stripped and signed alike),
# plus LICENSE, NOTICE, SOURCE.txt, DEPENDENCIES.txt. asset.json names the
# placer; a published asset without that key predates it and resolve rebuilds it.
#
# Public downloads: TensorFleet/fabdesk is private, so GitHub release URLs
# 404 for real users. mirror-public.sh copies archives + a rewritten manifest
# to downloads.fabplane.com/tracemaker (same R2 bucket as desktop installers)
# when the owner has configured secrets. Unset credentials skip with a notice
# and exit 0. A configured upload or sha256 failure exits non-zero. The mirror
# still runs when the immutable tag already exists (skip=true): it re-uploads
# tracemaker-latest/manifest.json instead of skipping the whole workflow.
#
# Not built (marked, not blocking):
#   - macos-x86_64: GitHub Intel macOS runners are deprecated and expensive;
#     brew bottles on Apple silicon are arm64, so a cheap extra cell is not practical.
#
# Triggers: weekly cron + workflow_dispatch only. No push/PR builds.

name: TraceMaker binaries

on:
  schedule:
    - cron: "17 4 * * 1" # Monday 04:17 UTC — after the Sunday desktop nightly, before the 13:00 security scan
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream tag, branch, or commit (empty = latest DingoOz/TraceMaker release tag, else default-branch HEAD)"
        required: false
        type: string
      force:
        description: "Rebuild every expected platform even if the immutable tag already has them"
        required: false
        type: boolean
        default: false

concurrency:
  group: tracemaker-binaries
  cancel-in-progress: false

permissions:
  contents: write

env:
  TRACEMAKER_UPSTREAM_REPO: DingoOz/TraceMaker

jobs:
  resolve:
    name: Resolve upstream ref
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.resolve.outputs.skip }}
      force: ${{ steps.resolve.outputs.force }}
      release_exists: ${{ steps.resolve.outputs.release_exists }}
      missing_platforms: ${{ steps.resolve.outputs.missing_platforms }}
      published_platforms: ${{ steps.resolve.outputs.published_platforms }}
      expected_platforms: ${{ steps.resolve.outputs.expected_platforms }}
      waived_platforms: ${{ steps.resolve.outputs.waived_platforms }}
      upstream_repo: ${{ steps.resolve.outputs.upstream_repo }}
      upstream_ref: ${{ steps.resolve.outputs.upstream_ref }}
      upstream_tag: ${{ steps.resolve.outputs.upstream_tag }}
      upstream_commit: ${{ steps.resolve.outputs.upstream_commit }}
      upstream_short: ${{ steps.resolve.outputs.upstream_short }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      source_url: ${{ steps.resolve.outputs.source_url }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false

      - name: Resolve DingoOz/TraceMaker and skip if already published
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          # `inputs` is empty on schedule. Boolean dispatch values stay booleans
          # in `inputs` and become the strings "true"/"false" from the CLI, so
          # accept both. A scheduled run must not force a rebuild.
          TRACEMAKER_FORCE: ${{ github.event_name == 'workflow_dispatch' && (inputs.force == true || inputs.force == 'true') }}
        run: bash "${GITHUB_WORKSPACE}/scripts/tracemaker/resolve-upstream.sh" "${{ github.event_name == 'workflow_dispatch' && inputs.upstream_ref || '' }}"

  build-linux:
    name: linux-x86_64
    needs: resolve
    if: needs.resolve.outputs.skip != 'true' && (needs.resolve.outputs.force == 'true' || contains(format(',{0},', needs.resolve.outputs.missing_platforms), ',linux-x86_64,'))
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 60
    steps:
      - name: Install build dependencies (matches DingoOz/TraceMaker CI)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            g++-15 cmake ninja-build git ca-certificates curl python3 \
            libboost-dev libboost-system-dev libeigen3-dev nlohmann-json3-dev libcli11-dev \
            libsqlite3-dev libzstd-dev patchelf

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: DingoOz/TraceMaker
          ref: ${{ needs.resolve.outputs.upstream_commit }}
          path: TraceMaker
          persist-credentials: false

      - name: Build tracemaker + tracemaker-place
        id: build
        run: bash "${GITHUB_WORKSPACE}/scripts/tracemaker/build.sh" "${GITHUB_WORKSPACE}/TraceMaker" linux-x86_64

      - name: Smoke test
        run: bash "${GITHUB_WORKSPACE}/scripts/tracemaker/smoke.sh" "${{ steps.build.outputs.binary }}" "${GITHUB_WORKSPACE}/scripts/tracemaker/fixtures/smoke.kicad_pcb" "${RUNNER_TEMP}/tracemaker-smoke" "${{ steps.build.outputs.placer }}"

      - name: Package (binary + LICENSE + SOURCE.txt)
        env:
          TRACEMAKER_UPSTREAM_REPO: ${{ needs.resolve.outputs.upstream_repo }}
          TRACEMAKER_UPSTREAM_TAG: ${{ needs.resolve.outputs.upstream_tag }}
          TRACEMAKER_UPSTREAM_COMMIT: ${{ needs.resolve.outputs.upstream_commit }}
          TRACEMAKER_SOURCE_URL: ${{ needs.resolve.outputs.source_url }}
          TRACEMAKER_RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          export TRACEMAKER_SRC="${GITHUB_WORKSPACE}/TraceMaker"
          bash "${GITHUB_WORKSPACE}/scripts/tracemaker/package.sh" \
            "${{ steps.build.outputs.binary }}" linux-x86_64 \
            "${GITHUB_WORKSPACE}/pack/linux-x86_64" \
            "${{ steps.build.outputs.placer }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tracemaker-linux-x86_64
          path: pack/linux-x86_64/
          if-no-files-found: error
          retention-days: 7

  select-tracemaker-macos-runner:
    needs: resolve
    permissions:
      contents: write
    uses: ./.github/workflows/select-macos-runner.yml
    if: needs.resolve.outputs.skip != 'true' && (needs.resolve.outputs.force == 'true' || contains(format(',{0},', needs.resolve.outputs.missing_platforms), ',macos-arm64,'))

  build-macos:
    name: macos-arm64
    needs: [resolve, select-tracemaker-macos-runner]
    if: needs.resolve.outputs.skip != 'true' && (needs.resolve.outputs.force == 'true' || contains(format(',{0},', needs.resolve.outputs.missing_platforms), ',macos-arm64,'))
    runs-on: ${{ fromJSON(needs.select-tracemaker-macos-runner.outputs.runner) }}
    timeout-minutes: 60
    steps:
      - name: Install build dependencies (upstream README brew list + LLVM libc++)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: brew install cmake ninja eigen cli11 nlohmann-json zstd boost llvm

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: DingoOz/TraceMaker
          ref: ${{ needs.resolve.outputs.upstream_commit }}
          path: TraceMaker
          persist-credentials: false

      - name: Build, probe, and smoke macOS variants (system libc++ then llvm-static)
        id: build
        env:
          TRACEMAKER_DIAG_DIR: ${{ runner.temp }}/tracemaker-macos-debug
        run: bash "${GITHUB_WORKSPACE}/scripts/tracemaker/macos-variants.sh" "${GITHUB_WORKSPACE}/TraceMaker" macos-arm64 "${GITHUB_WORKSPACE}/scripts/tracemaker/fixtures/smoke.kicad_pcb"

      - name: Upload unpackaged binaries + abort diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tracemaker-macos-arm64-debug
          path: |
            ${{ runner.temp }}/tracemaker-macos-debug/
            TraceMaker/build/macos-metal-system/src/app/tracemaker
            TraceMaker/build/macos-metal-llvm-static/src/app/tracemaker
            TraceMaker/build/macos-metal-system/src/place/tracemaker-place
            TraceMaker/build/macos-metal-llvm-static/src/place/tracemaker-place
            TraceMaker/build/macos-metal-system/fabdesk-build.log
            TraceMaker/build/macos-metal-llvm-static/fabdesk-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Package (binary + LICENSE + SOURCE.txt)
        env:
          TRACEMAKER_UPSTREAM_REPO: ${{ needs.resolve.outputs.upstream_repo }}
          TRACEMAKER_UPSTREAM_TAG: ${{ needs.resolve.outputs.upstream_tag }}
          TRACEMAKER_UPSTREAM_COMMIT: ${{ needs.resolve.outputs.upstream_commit }}
          TRACEMAKER_SOURCE_URL: ${{ needs.resolve.outputs.source_url }}
          TRACEMAKER_RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          export TRACEMAKER_SRC="${GITHUB_WORKSPACE}/TraceMaker"
          bash "${GITHUB_WORKSPACE}/scripts/tracemaker/package.sh" \
            "${{ steps.build.outputs.binary }}" macos-arm64 \
            "${GITHUB_WORKSPACE}/pack/macos-arm64" \
            "${{ steps.build.outputs.placer }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tracemaker-macos-arm64
          path: pack/macos-arm64/
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: windows-x86_64
    needs: resolve
    if: needs.resolve.outputs.skip != 'true' && (needs.resolve.outputs.force == 'true' || contains(format(',{0},', needs.resolve.outputs.missing_platforms), ',windows-x86_64,'))
    runs-on: windows-latest
    timeout-minutes: 90
    # A Windows failure must not fail the workflow or block linux/macos publish.
    continue-on-error: true
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Enable long paths and LF checkouts
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true
          # Git for Windows defaults to core.autocrlf=true. actions/checkout
          # overrides HOME, so --global is ignored during the TraceMaker
          # checkout; --system is what that git.exe actually reads.
          # Run 38082482176: LF patch vs CRLF escape.cpp / viewer_server.cpp.
          git config --system core.autocrlf false
          git config --system core.eol lf

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cc
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-eigen3
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-cli11
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-zstd
            zip
            python
            git
          # `zip` is preferred. package.sh falls back to `python3 -m zipfile -c`
          # (then `python`) when zip is not on PATH, which is the self-hosted
          # Linux verify runner. UCRT64 gets both so either path works.

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        env:
          # Survives actions/checkout's temporary HOME (system config alone
          # is enough for git.exe; this pins MSYS2 git the same way).
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          persist-credentials: false
          submodules: false

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        env:
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          repository: DingoOz/TraceMaker
          ref: ${{ needs.resolve.outputs.upstream_commit }}
          path: TraceMaker
          persist-credentials: false

      - name: Build tracemaker.exe + tracemaker-place.exe
        id: build
        env:
          MSYSTEM: UCRT64
        run: |
          # GITHUB_WORKSPACE is D:\...; backslashes are escapes in bash.
          ws="$(cygpath -u "${GITHUB_WORKSPACE}")"
          bash "${ws}/scripts/tracemaker/build.sh" "${ws}/TraceMaker" windows-x86_64

      - name: Upload unpackaged binary + build log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tracemaker-windows-x86_64-debug
          path: |
            TraceMaker/build/windows-x86_64/src/app/tracemaker.exe
            TraceMaker/build/windows-x86_64/src/place/tracemaker-place.exe
            TraceMaker/build/windows-x86_64/fabdesk-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Smoke test
        run: |
          ws="$(cygpath -u "${GITHUB_WORKSPACE}")"
          bash "${ws}/scripts/tracemaker/smoke.sh" "${{ steps.build.outputs.binary }}" "${ws}/scripts/tracemaker/fixtures/smoke.kicad_pcb" "$(cygpath -u "${RUNNER_TEMP}")/tracemaker-smoke" "${{ steps.build.outputs.placer }}"

      - name: Package (zip + LICENSE + SOURCE.txt)
        env:
          TRACEMAKER_UPSTREAM_REPO: ${{ needs.resolve.outputs.upstream_repo }}
          TRACEMAKER_UPSTREAM_TAG: ${{ needs.resolve.outputs.upstream_tag }}
          TRACEMAKER_UPSTREAM_COMMIT: ${{ needs.resolve.outputs.upstream_commit }}
          TRACEMAKER_SOURCE_URL: ${{ needs.resolve.outputs.source_url }}
          TRACEMAKER_RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          ws="$(cygpath -u "${GITHUB_WORKSPACE}")"
          export TRACEMAKER_SRC="${ws}/TraceMaker"
          bash "${ws}/scripts/tracemaker/package.sh" \
            "${{ steps.build.outputs.binary }}" windows-x86_64 \
            "${ws}/pack/windows-x86_64" \
            "${{ steps.build.outputs.placer }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tracemaker-windows-x86_64
          path: pack/windows-x86_64/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [resolve, build-linux, build-macos, build-windows]
    if: needs.resolve.outputs.skip != 'true' && !cancelled() && (needs.build-linux.result == 'success' || needs.build-macos.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false

      # tracemaker-* also matches the failure-only build-log artifact; publish.sh
      # only reads */asset.json, then merges with the existing immutable tag
      # after checksum-verifying kept archives. Uploads use --clobber; both
      # tags use --latest=false.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tracemaker-*
          path: artifacts
          merge-multiple: false

      - name: Publish immutable tag and rolling tracemaker-latest
        env:
          GH_TOKEN: ${{ github.token }}
          TRACEMAKER_RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          TRACEMAKER_UPSTREAM_REPO: ${{ needs.resolve.outputs.upstream_repo }}
          TRACEMAKER_UPSTREAM_TAG: ${{ needs.resolve.outputs.upstream_tag }}
          TRACEMAKER_UPSTREAM_COMMIT: ${{ needs.resolve.outputs.upstream_commit }}
          TRACEMAKER_SOURCE_URL: ${{ needs.resolve.outputs.source_url }}
        run: bash "${GITHUB_WORKSPACE}/scripts/tracemaker/publish.sh" "${GITHUB_WORKSPACE}/artifacts"

  mirror:
    name: Mirror to public downloads
    needs: [resolve, publish]
    # Run after a successful publish, and also when the immutable tag already
    # exists (skip=true, or publish skipped/failed). A cancelled publish does
    # not mirror. Unset credentials still exit 0 inside the script; a
    # configured upload or sha256 failure fails this job.
    if: always() && !cancelled() && needs.resolve.result == 'success' && (needs.publish.result == 'success' || (needs.resolve.outputs.release_exists == 'true' && needs.publish.result != 'cancelled'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false

      - name: Download the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TRACEMAKER_RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          gh release download "$TRACEMAKER_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "${GITHUB_WORKSPACE}/artifacts"

      - name: Mirror to public downloads (R2 or public repo)
        env:
          GH_TOKEN: ${{ github.token }}
          TRACEMAKER_RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          TRACEMAKER_PUBLIC_BASE_URL: ${{ vars.TRACEMAKER_PUBLIC_BASE_URL }}
          TRACEMAKER_S3_BUCKET: ${{ vars.TRACEMAKER_S3_BUCKET }}
          TRACEMAKER_S3_ENDPOINT: ${{ vars.TRACEMAKER_S3_ENDPOINT }}
          TRACEMAKER_S3_REGION: ${{ vars.TRACEMAKER_S3_REGION }}
          TRACEMAKER_S3_PREFIX: ${{ vars.TRACEMAKER_S3_PREFIX }}
          TRACEMAKER_S3_ACCESS_KEY_ID: ${{ secrets.TRACEMAKER_S3_ACCESS_KEY_ID }}
          TRACEMAKER_S3_SECRET_ACCESS_KEY: ${{ secrets.TRACEMAKER_S3_SECRET_ACCESS_KEY }}
          TRACEMAKER_PUBLIC_RELEASE_REPO: ${{ vars.TRACEMAKER_PUBLIC_RELEASE_REPO }}
          TRACEMAKER_PUBLIC_RELEASE_TOKEN: ${{ secrets.TRACEMAKER_PUBLIC_RELEASE_TOKEN }}
          DESKTOP_R2_ACCESS_KEY_ID: ${{ vars.DESKTOP_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash "${GITHUB_WORKSPACE}/scripts/tracemaker/mirror-public.sh" "${GITHUB_WORKSPACE}/artifacts"

  summarize:
    name: Summarize platform status
    needs: [resolve, build-linux, build-macos, build-windows, publish]
    if: always() && !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false

      - name: Record Windows waiver / job summary
        env:
          GH_TOKEN: ${{ github.token }}
          TRACEMAKER_RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          TRACEMAKER_LINUX_RESULT: ${{ needs.build-linux.result }}
          TRACEMAKER_MACOS_RESULT: ${{ needs.build-macos.result }}
          TRACEMAKER_WINDOWS_RESULT: ${{ needs.build-windows.result }}
          TRACEMAKER_PUBLISH_RESULT: ${{ needs.publish.result }}
          TRACEMAKER_MISSING_PLATFORMS: ${{ needs.resolve.outputs.missing_platforms }}
          TRACEMAKER_PUBLISHED_PLATFORMS: ${{ needs.resolve.outputs.published_platforms }}
        run: bash "${GITHUB_WORKSPACE}/scripts/tracemaker/summarize-run.sh"

  release-tracemaker-macos-runner:
    needs: [select-tracemaker-macos-runner, build-macos]
    if: always() && needs.select-tracemaker-macos-runner.outputs.lease != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release-macos-runner.yml
    with:
      lease: ${{ needs.select-tracemaker-macos-runner.outputs.lease }}
