# Manually dispatched TraceMaker binaries for Settings → Routers.
#
# Upstream (DingoOz/TraceMaker) is C++20 / GPL-3.0-or-later and publishes no
# official router binaries. This workflow follows their README + CI:
#   Linux:  cmake --preset cpu-only   (Ubuntu 26.04, GCC 15, no CUDA)
#   macOS:  cmake --preset macos-metal, CMAKE_OSX_DEPLOYMENT_TARGET=15.0.
#           Two libc++ variants in one job (prefer A): Apple clang + system
#           libc++.1.dylib, then Homebrew LLVM static libc++ (run 38016562996
#           linked B then SIGABRT on --help). Smoke each; publish the first
#           that passes. A commit-pinned from_chars(double) + <cstdlib> patch
#           is applied when HEAD matches v0.9.0. SQLite headers are isolated
#           so FindSQLite3 does not -isystem the Xcode SDK (run 38005104781).
#           zstd is libzstd.a (run 38009143938). ninja -k 0; smoke abort
#           uploads unpackaged binaries + lldb/dyld/crash logs.
# Each archive ships tracemaker and its placer tracemaker-place (board_route's
# floorplan path; built, linkage-probed, smoked, stripped and signed alike),
# plus LICENSE, NOTICE, SOURCE.txt, DEPENDENCIES.txt. asset.json names the
# placer; a published asset without that key predates it.
#
# Dispatch with a known upstream tag or commit. Each run uses a fresh
# -b<run_id>-<attempt> version. Smoke tests cover both programs; publication
# never replaces versioned objects. After checking the smoke results and public
# hashes, use update-pin.py to copy the public manifest and open a reviewed PR.
#
# Not built (marked, not blocking):
#   - macos-x86_64: GitHub Intel macOS runners are deprecated and expensive;
#     brew bottles on Apple silicon are arm64, so a cheap extra cell is not practical.
#
# Trigger: workflow_dispatch only. No scheduled, push or PR builds.

name: TraceMaker binaries

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Known upstream tag or commit to build"
        required: true
        type: string
      publish:
        description: "Publish the complete verified build (false uploads workflow artifacts only)"
        required: false
        type: boolean
        default: false

concurrency:
  group: tracemaker-binaries
  cancel-in-progress: false

permissions:
  contents: read

env:
  TRACEMAKER_UPSTREAM_REPO: DingoOz/TraceMaker

jobs:
  resolve:
    name: Resolve upstream ref
    runs-on: ubuntu-latest
    outputs:
      upstream_repo: ${{ steps.resolve.outputs.upstream_repo }}
      upstream_ref: ${{ steps.resolve.outputs.upstream_ref }}
      upstream_tag: ${{ steps.resolve.outputs.upstream_tag }}
      upstream_commit: ${{ steps.resolve.outputs.upstream_commit }}
      upstream_short: ${{ steps.resolve.outputs.upstream_short }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      source_url: ${{ steps.resolve.outputs.source_url }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false

      - name: Resolve the requested DingoOz/TraceMaker ref
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TRACEMAKER_INPUT_REF: ${{ inputs.upstream_ref }}
        run: bash "${GITHUB_WORKSPACE}/scripts/tracemaker/resolve-upstream.sh" "$TRACEMAKER_INPUT_REF"

  build-linux:
    name: linux-x86_64
    needs: resolve
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    env:
      CXX: g++-15
      CC: gcc-15
    timeout-minutes: 60
    steps:
      - name: Install build dependencies (matches DingoOz/TraceMaker CI)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            g++-15 cmake ninja-build git ca-certificates curl python3 \
            libboost-dev libboost-system-dev libeigen3-dev nlohmann-json3-dev libcli11-dev \
            libsqlite3-dev libzstd-dev patchelf dpkg-dev

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: DingoOz/TraceMaker
          ref: ${{ needs.resolve.outputs.upstream_commit }}
          path: TraceMaker
          persist-credentials: false

      - name: Build tracemaker + tracemaker-place
        id: build
        run: bash "${GITHUB_WORKSPACE}/scripts/tracemaker/build.sh" "${GITHUB_WORKSPACE}/TraceMaker" linux-x86_64

      - name: Smoke test
        run: bash "${GITHUB_WORKSPACE}/scripts/tracemaker/smoke.sh" "${{ steps.build.outputs.binary }}" "${GITHUB_WORKSPACE}/scripts/tracemaker/fixtures/smoke.kicad_pcb" "${RUNNER_TEMP}/tracemaker-smoke" "${{ steps.build.outputs.placer }}"

      - name: Package (binary + LICENSE + SOURCE.txt)
        env:
          TRACEMAKER_UPSTREAM_REPO: ${{ needs.resolve.outputs.upstream_repo }}
          TRACEMAKER_UPSTREAM_TAG: ${{ needs.resolve.outputs.upstream_tag }}
          TRACEMAKER_UPSTREAM_COMMIT: ${{ needs.resolve.outputs.upstream_commit }}
          TRACEMAKER_SOURCE_URL: ${{ needs.resolve.outputs.source_url }}
          TRACEMAKER_RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          export TRACEMAKER_SRC="${GITHUB_WORKSPACE}/TraceMaker"
          bash "${GITHUB_WORKSPACE}/scripts/tracemaker/package.sh" \
            "${{ steps.build.outputs.binary }}" linux-x86_64 \
            "${GITHUB_WORKSPACE}/pack/linux-x86_64" \
            "${{ steps.build.outputs.placer }}"
          python3 "${GITHUB_WORKSPACE}/scripts/tracemaker/check-archive.py" "${GITHUB_WORKSPACE}/pack"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tracemaker-linux-x86_64
          path: pack/linux-x86_64/
          if-no-files-found: error
          retention-days: 7

  select-tracemaker-macos-runner:
    needs: resolve
    permissions:
      contents: write
    uses: ./.github/workflows/select-macos-runner.yml

  build-macos:
    name: macos-arm64
    needs: [resolve, select-tracemaker-macos-runner]
    runs-on: ${{ fromJSON(needs.select-tracemaker-macos-runner.outputs.runner) }}
    timeout-minutes: 60
    steps:
      - name: Install build dependencies (upstream README brew list + LLVM libc++)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: brew install cmake ninja eigen cli11 nlohmann-json zstd boost llvm

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: DingoOz/TraceMaker
          ref: ${{ needs.resolve.outputs.upstream_commit }}
          path: TraceMaker
          persist-credentials: false

      - name: Build, probe, and smoke macOS variants (system libc++ then llvm-static)
        id: build
        env:
          TRACEMAKER_DIAG_DIR: ${{ runner.temp }}/tracemaker-macos-debug
        run: bash "${GITHUB_WORKSPACE}/scripts/tracemaker/macos-variants.sh" "${GITHUB_WORKSPACE}/TraceMaker" macos-arm64 "${GITHUB_WORKSPACE}/scripts/tracemaker/fixtures/smoke.kicad_pcb"

      - name: Upload unpackaged binaries + abort diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tracemaker-macos-arm64-debug
          path: |
            ${{ runner.temp }}/tracemaker-macos-debug/
            TraceMaker/build/macos-metal-system/src/app/tracemaker
            TraceMaker/build/macos-metal-llvm-static/src/app/tracemaker
            TraceMaker/build/macos-metal-system/src/place/tracemaker-place
            TraceMaker/build/macos-metal-llvm-static/src/place/tracemaker-place
            TraceMaker/build/macos-metal-system/fabdesk-build.log
            TraceMaker/build/macos-metal-llvm-static/fabdesk-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Package (binary + LICENSE + SOURCE.txt)
        env:
          TRACEMAKER_UPSTREAM_REPO: ${{ needs.resolve.outputs.upstream_repo }}
          TRACEMAKER_UPSTREAM_TAG: ${{ needs.resolve.outputs.upstream_tag }}
          TRACEMAKER_UPSTREAM_COMMIT: ${{ needs.resolve.outputs.upstream_commit }}
          TRACEMAKER_SOURCE_URL: ${{ needs.resolve.outputs.source_url }}
          TRACEMAKER_RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          export TRACEMAKER_SRC="${GITHUB_WORKSPACE}/TraceMaker"
          bash "${GITHUB_WORKSPACE}/scripts/tracemaker/package.sh" \
            "${{ steps.build.outputs.binary }}" macos-arm64 \
            "${GITHUB_WORKSPACE}/pack/macos-arm64" \
            "${{ steps.build.outputs.placer }}"
          python3 "${GITHUB_WORKSPACE}/scripts/tracemaker/check-archive.py" "${GITHUB_WORKSPACE}/pack"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tracemaker-macos-arm64
          path: pack/macos-arm64/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [resolve, build-linux, build-macos]
    if: ${{ inputs.publish && !cancelled() && needs.build-linux.result == 'success' && needs.build-macos.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false

      # Failure-only debug artifacts have no asset.json and are ignored.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tracemaker-*
          path: artifacts
          merge-multiple: false

      - name: Publish complete immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          TRACEMAKER_RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          TRACEMAKER_UPSTREAM_REPO: ${{ needs.resolve.outputs.upstream_repo }}
          TRACEMAKER_UPSTREAM_TAG: ${{ needs.resolve.outputs.upstream_tag }}
          TRACEMAKER_UPSTREAM_COMMIT: ${{ needs.resolve.outputs.upstream_commit }}
          TRACEMAKER_SOURCE_URL: ${{ needs.resolve.outputs.source_url }}
        run: bash "${GITHUB_WORKSPACE}/scripts/tracemaker/publish.sh" "${GITHUB_WORKSPACE}/artifacts"

  mirror:
    name: Mirror to public downloads
    needs: [resolve, build-linux, build-macos, publish]
    # Mirror only successfully published runs; pin changes are reviewed separately.
    if: ${{ inputs.publish && !cancelled() && needs.build-linux.result == 'success' && needs.build-macos.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false

      - name: Download the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TRACEMAKER_RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          gh release download "$TRACEMAKER_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "${GITHUB_WORKSPACE}/artifacts"

      - name: Mirror to public downloads (R2 or public repo)
        env:
          GH_TOKEN: ${{ github.token }}
          TRACEMAKER_RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          TRACEMAKER_PUBLIC_BASE_URL: ${{ vars.TRACEMAKER_PUBLIC_BASE_URL }}
          TRACEMAKER_S3_BUCKET: ${{ vars.TRACEMAKER_S3_BUCKET }}
          TRACEMAKER_S3_ENDPOINT: ${{ vars.TRACEMAKER_S3_ENDPOINT }}
          TRACEMAKER_S3_REGION: ${{ vars.TRACEMAKER_S3_REGION }}
          TRACEMAKER_S3_PREFIX: ${{ vars.TRACEMAKER_S3_PREFIX }}
          TRACEMAKER_S3_ACCESS_KEY_ID: ${{ secrets.TRACEMAKER_S3_ACCESS_KEY_ID }}
          TRACEMAKER_S3_SECRET_ACCESS_KEY: ${{ secrets.TRACEMAKER_S3_SECRET_ACCESS_KEY }}
          TRACEMAKER_PUBLIC_RELEASE_REPO: ${{ vars.TRACEMAKER_PUBLIC_RELEASE_REPO }}
          TRACEMAKER_PUBLIC_RELEASE_TOKEN: ${{ secrets.TRACEMAKER_PUBLIC_RELEASE_TOKEN }}
          DESKTOP_R2_ACCESS_KEY_ID: ${{ vars.DESKTOP_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash "${GITHUB_WORKSPACE}/scripts/tracemaker/mirror-public.sh" "${GITHUB_WORKSPACE}/artifacts"

  summarize:
    name: Summarize platform status
    needs: [resolve, build-linux, build-macos, publish]
    if: always() && !cancelled() && needs.resolve.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: false

      - name: Record platform job summary
        env:
          TRACEMAKER_RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          TRACEMAKER_LINUX_RESULT: ${{ needs.build-linux.result }}
          TRACEMAKER_MACOS_RESULT: ${{ needs.build-macos.result }}
          TRACEMAKER_PUBLISH_RESULT: ${{ needs.publish.result }}
        run: bash "${GITHUB_WORKSPACE}/scripts/tracemaker/summarize-run.sh"

  release-tracemaker-macos-runner:
    needs: [select-tracemaker-macos-runner, build-macos]
    if: always() && needs.select-tracemaker-macos-runner.outputs.lease != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release-macos-runner.yml
    with:
      lease: ${{ needs.select-tracemaker-macos-runner.outputs.lease }}
