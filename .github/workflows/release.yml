name: Release

# Nightly and manual public runs produce a release: version 0.<minor>.<run_number>,
# a git tag, a GitHub Release with installers for macOS (arm64, x64), Linux and Windows,
# SHA256SUMS, and manifest.json. The website script (fabplane.com scripts/publish-desktop-release.ts)
# consumes manifest.json to publish download links and desktop/latest.json.
# Internal builds (workflow_dispatch channel=internal) are uploaded as workflow artifacts only.

on:
  schedule:
    - cron: "0 20 * * *" # 03:00 Asia/Bangkok
  workflow_dispatch:
    inputs:
      channel:
        description: "public or internal (internal bundles the private router; never released)"
        required: true
        default: "public"
        type: choice
        options: [public, internal]

concurrency:
  group: release-${{ inputs.channel || 'public' }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CHANNEL: ${{ inputs.channel || 'public' }}

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          version="${base}.${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Release version $version"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: bun-darwin-arm64, eb: "--mac --arm64" }
          - { os: macos-14, target: bun-darwin-x64, eb: "--mac --x64" }
          - { os: ubuntu-22.04, target: bun-linux-x64, eb: "--linux" }
          - { os: windows-latest, target: bun-windows-x64, eb: "--win" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # Read-only deploy keys for the private submodules, fabplane.com and fab_pcb (one secret,
      # keys concatenated; each key's comment names its repo so ssh-agent maps it to that repo over https).
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.FABDESK_SUBMODULE_SSH_KEY }}

      - name: Init the fabplane and fab_pcb submodules
        run: git submodule update --init --depth 1 vendor/fabplane vendor/fab_pcb


      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile
      - name: Stamp version ${{ needs.version.outputs.version }}
        run: bun run scripts/set-version.ts ${{ needs.version.outputs.version }}
      - run: bun run typecheck

      # Sentry error reporting (docs/sentry.md). The DSN is a public write-only key; export it only when the
      # SENTRY_DESKTOP_DSN repo secret is set so builds without it ship with reporting off. Both spellings are
      # exported (SENTRY_* primary, FABDESK_SENTRY_* legacy); the release is fabdesk[-core]@<version>+<GITHUB_SHA>.
      - name: Error reporting environment
        shell: bash
        env:
          S_SENTRY_DESKTOP_DSN: ${{ secrets.SENTRY_DESKTOP_DSN }}
        run: |
          if [ -n "$S_SENTRY_DESKTOP_DSN" ]; then
            for name in SENTRY_DESKTOP_DSN VITE_SENTRY_DESKTOP_DSN FABDESK_SENTRY_DSN VITE_FABDESK_SENTRY_DSN; do
              echo "$name=$S_SENTRY_DESKTOP_DSN" >> "$GITHUB_ENV"
            done
            echo "SENTRY_ENVIRONMENT=production" >> "$GITHUB_ENV"
            echo "VITE_SENTRY_ENVIRONMENT=production" >> "$GITHUB_ENV"
            echo "SENTRY_DESKTOP_DSN: set"
          else
            echo "SENTRY_DESKTOP_DSN: unset (error reporting off)"
          fi

      - name: Build core (${{ matrix.target }})
        run: bun run --cwd apps/core build --only ${{ matrix.target }} --channel ${{ env.CHANNEL }}

      - name: Build renderer/main
        run: bun run --cwd apps/desktop build

      # electron-builder treats an empty CSC_LINK as a file path, so only export secrets that are set.
      - name: Signing environment
        shell: bash
        env:
          S_CSC_LINK: ${{ secrets.CSC_LINK }}
          S_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          S_WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          S_WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          S_APPLE_ID: ${{ secrets.APPLE_ID }}
          S_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          S_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # CSC_LINK is the Apple Developer ID certificate. electron-builder on Windows falls back to it
          # when WIN_CSC_LINK is absent, which produced installers with an untrusted Authenticode
          # signature, so the Apple certificate is exported on macOS only. Windows signing uses
          # WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD (a code-signing certificate for Windows) when set.
          names="APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID"
          case "$RUNNER_OS" in
            macOS) names="CSC_LINK CSC_KEY_PASSWORD $names" ;;
            Windows) names="WIN_CSC_LINK WIN_CSC_KEY_PASSWORD" ;;
          esac
          for name in $names; do
            value="$(printenv "S_$name" || true)"
            if [ -n "$value" ]; then echo "$name=$value" >> "$GITHUB_ENV"; echo "$name: set"; else echo "$name: unset"; fi
          done
          if [ "$RUNNER_OS" != macOS ] || [ -z "$S_CSC_LINK" ]; then echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"; fi

      - name: Package
        shell: bash
        env:
          FABDESK_CHANNEL: ${{ env.CHANNEL }}
        run: cd apps/desktop && bunx electron-builder ${{ matrix.eb }} --publish never

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p release-out
          find apps/desktop/release -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' \) -exec cp {} release-out/ \;
          ls -la release-out

      # Fail fast on a bad image: some runs have produced DMGs whose internal CRCs do not match.
      - name: Verify installers on the runner
        shell: bash
        run: bun run scripts/verify-installers.ts release-out --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: release-out/*
          if-no-files-found: error

  release:
    needs: [version, build]
    if: github.ref == 'refs/heads/main' && (inputs.channel == '' || inputs.channel == 'public')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags for the release notes
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: artifacts
          merge-multiple: true

      - name: Release notes (commits since the previous tag)
        run: bun run scripts/release-notes.ts --out artifacts/NOTES.md --head ${{ github.sha }} && cat artifacts/NOTES.md

      # The per-runner sums prove the artifacts survived upload/download unchanged.
      - name: Verify artifacts against runner checksums
        run: |
          cd artifacts
          for sums in SHA256SUMS-*.txt; do
            grep -v 'SHA256SUMS-' "$sums" | shasum -a 256 -c - || { echo "::error::artifact checksum mismatch in $sums"; exit 1; }
          done
          rm -f SHA256SUMS-*.txt

      - name: Manifest and checksums
        run: |
          bun run scripts/release-manifest.ts \
            --dir artifacts \
            --version ${{ needs.version.outputs.version }} \
            --tag ${{ needs.version.outputs.tag }} \
            --repo ${{ github.repository }} \
            --commit ${{ github.sha }} \
            --notes-file artifacts/NOTES.md \
            --out artifacts/manifest.json \
            --sums artifacts/SHA256SUMS
          cat artifacts/manifest.json

      - name: Tag and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag ${{ needs.version.outputs.tag }} ${{ github.sha }}
          git push origin ${{ needs.version.outputs.tag }}
          assets=()
          for file in artifacts/*; do
            if [ "$file" != artifacts/NOTES.md ]; then assets+=("$file"); fi
          done
          gh release create ${{ needs.version.outputs.tag }} \
            --title "fabPlane ${{ needs.version.outputs.version }}" \
            --notes-file artifacts/NOTES.md \
            "${assets[@]}"

  website:
    name: Hand off public release to fabplane.com
    needs: [version, release]
    runs-on: ubuntu-22.04
    permissions: {}
    steps:
      - name: Trigger website installer and feed publishing
        env:
          GH_TOKEN: ${{ secrets.FABPLANE_RELEASE_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          test -n "$GH_TOKEN" || { echo "::error::Missing FABPLANE_RELEASE_DISPATCH_TOKEN (fabplane.com Actions write)"; exit 1; }
          gh workflow run desktop-release.yml --repo TensorFleet/fabplane.com --ref main -f tag="$RELEASE_TAG"
