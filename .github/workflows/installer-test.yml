name: Windows GUI focus fixture
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gui:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        case: [idle, intervening-input]
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            apps/desktop/scripts
            scripts/vm/guest
          persist-credentials: false
      - name: Compile the production waiter and disposable GUI windows
        shell: pwsh
        run: |
          $compiler = Join-Path $env:SystemRoot 'Microsoft.NET/Framework/v4.0.30319/csc.exe'
          & $compiler /nologo /target:winexe ('/out:' + $env:RUNNER_TEMP + '\waiter.exe') (Resolve-Path apps/desktop/scripts/update-windows-launch.cs).Path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $compiler /nologo /target:winexe /r:System.Drawing.dll /r:System.Windows.Forms.dll ('/out:' + $env:RUNNER_TEMP + '\fixture.exe') (Resolve-Path scripts/vm/guest/focus-fixture.cs).Path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Observe foreground after an explicit restart
        shell: pwsh
        run: python scripts/vm/guest/focus-fixture.py (Join-Path $env:RUNNER_TEMP 'fixture.exe') ${{ matrix.case }}
