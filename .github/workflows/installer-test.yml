name: Installer test
on: workflow_dispatch
permissions:
  actions: read
  contents: read
jobs:
  ubuntu24-x11:
    name: Ubuntu 24.04 X11 ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: internal, input: "--run 45761812816"}
          - {label: public, input: "--tag v0.4.26"}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: scripts/vm
          sparse-checkout-cone-mode: false
      - name: Install desktop dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfuse2t64 xvfb openbox x11-utils imagemagick libgtk-3-0t64 libnss3 libxss1 libasound2t64 libgbm1 libatk-bridge2.0-0t64 libdrm2 xdg-utils
      - name: Launch normal installer under virtual X11 with a window manager
        env:
          GH_TOKEN: ${{ github.token }}
          SENTRY_DESKTOP_DSN: 'http://qa@127.0.0.1:9/1'
          SENTRY_ENVIRONMENT: 'installer-qa'
          XDG_SESSION_TYPE: x11
        run: bash scripts/vm/runner-test.sh linux '(x64|amd64|x86_64)' AppImage ${{ matrix.input }}
