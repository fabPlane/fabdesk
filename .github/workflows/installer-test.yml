name: Packaged macOS transfer interruption
on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string
      tag:
        required: true
        type: choice
        options: [baseline, recovered]
permissions:
  actions: read
  contents: read
jobs:
  transfer:
    runs-on: macos-15
    timeout-minutes: 18
    env:
      EXPECTATION: ${{ inputs.tag }}
      SOURCE_RUN: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/vm
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: installers-bun-darwin-arm64
          path: ${{ runner.temp }}/source
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Get exact published ZIP and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir "$RUNNER_TEMP/public-release"
          gh release download v0.4.26 --repo "$GITHUB_REPOSITORY" -p manifest.json -p fabplane-0.4.26-mac-arm64.zip -D "$RUNNER_TEMP/public-release"
      - name: Install the real signed PR build into Applications
        run: |
          set -eu
          cd "$RUNNER_TEMP/source"
          image=fabplane-0.4.24-mac-arm64.dmg
          grep -F "$image" SHA256SUMS-bun-darwin-arm64.txt | shasum -a 256 -c -
          test ! -e /Applications/fabPlane.app
          hdiutil attach -readonly -nobrowse -mountpoint /Volumes/FabDeskFault "$image"
          ditto /Volumes/FabDeskFault/fabPlane.app /Applications/fabPlane.app
          hdiutil detach /Volumes/FabDeskFault
          codesign --verify --strict /Applications/fabPlane.app
      - name: Click once and interrupt only the disposable loopback transfer
        run: python3 scripts/vm/guest/mac-transfer-fault.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: macos-transfer-evidence
          path: ${{ runner.temp }}/fault-evidence/
          if-no-files-found: ignore
          retention-days: 7
